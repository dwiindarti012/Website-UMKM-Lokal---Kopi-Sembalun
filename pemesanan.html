<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Pemesanan - Kopi Sembalun</title>
  <link rel="stylesheet" href="pemesanan.css">
</head>
<body>
   <nav class="navbar">
    <a href="index.html" class="nama-brand">Kopi Sembalun</a>
    <div class="menu">
      <a href="index.html">Beranda</a>
      <a href="produk.html">Produk</a>
      <a href="kontak.html">Kontak</a>
      <a href="saran.html">Saran dan Masukan</a>
      <a href="ulasan.html">Ulasan</a>
      <a href="pemesanan.html">Pemesanan</a>
    </div>
  </nav>

  <header class="hero">
    <h1>KOPI SEMBALUN</h1>
    <nav class="nav-halaman">
      <a href="pemesanan.html" class="aktif">Form Pemesanan</a>
      <a href="kontak.html">Informasi & Cara Pemesanan</a>
    </nav>
  </header>

  <div class="menu">
    <main>

      <section class="kartu">
        <h2>Form Pemesanan</h2>

        <form action="Pesan" method="POST" enctype="multipart/form-data">
          <label for="nama">Nama Lengkap</label>
          <input type="text" id="nama" name="nama" required>

          <label for="pesanan">Detail Pesanan</label>
          <textarea id="pesanan" name="pesanan" rows="3" required></textarea>

          <label for="alamat">Alamat Pengiriman</label>
          <textarea id="alamat" name="alamat" rows="2" required></textarea>

          <label for="nohp">No. WhatsApp</label>
          <input type="tel" id="nohp" name="nohp" required>

          <label for="bukti">Bukti Pembayaran (opsional)</label>
          <input type="file" id="bukti" name="bukti" class="input-file" accept="image/*,.pdf">
          <div class="upload">
            <label for="bukti" class="tombol tombol-upload">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3 6.5 8.5l1.4 1.4L11 6.8V16h2V6.8l3.1 3.1 1.4-1.4L12 3zM5 18v2h14v-2H5z"/></svg>
              Unggah File
            </label>
            <span id="nama-file" class="nama-file">Belum ada file dipilih</span>
          </div>
          <p class="petunjuk">Format yang diterima: JPG, PNG, atau PDF.</p>

          <button type="submit" class="tombol">Kirim Pesanan</button>
        </form>

        <p class="atau">Atau pesan instan lewat WhatsApp:</p>
        <a href="https://wa.me/6283117412383" target="_blank" class="tombol tombol-wa">Pesan Via WhatsApp</a>
      </section>

    </main>
  </div>
  <script src="app.js"></script>
  <script>
    var inputFile = document.getElementById("bukti");
    var namaFile = document.getElementById("nama-file");
    inputFile.addEventListener("change", function () {
      namaFile.textContent = inputFile.files.length ? inputFile.files[0].name : "Belum ada file dipilih";
    });
  </script>
</body>
</html>
